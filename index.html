<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Count - Gestão Financeira Minimalista</title>
    
    <!-- Bibliotecas de gráficos e Html2Canvas (para gerar imagem) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0d12;
            --surface-color: #141822;
            --surface-border: #232a3b;
            --surface-hover: #1c2230;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --danger: #f43f5e;
            --danger-glow: rgba(244, 63, 94, 0.15);
            --success: #10b981;
            --warning: #f59e0b;
            --purple: #a855f7;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.2s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px 16px;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .container { max-width: 620px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #0284c7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.5px; }

        .music-btn {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .music-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
        .music-btn.playing { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

        .card {
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--surface-border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-color);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 12px;
            text-align: center;
        }

        .stat-card .label { font-size: 0.68rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-card .value { font-size: 0.92rem; font-weight: 700; color: var(--text-primary); }
        .stat-card .value.highlight { color: var(--accent); }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .input-group.full { grid-column: span 2; }

        label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

        input, select {
            background: var(--bg-color);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            outline: none;
            width: 100%;
            transition: var(--transition);
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent), #0284c7);
            color: #0b0d12;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            width: 100%;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
            transition: var(--transition);
        }

        button.primary:hover { opacity: 0.92; transform: translateY(-1px); }
        button.primary:active { transform: translateY(0); }

        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .filter-container select { width: auto; min-width: 160px; padding: 8px 12px; font-size: 0.85rem; }

        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
            margin: 10px 0 20px 0;
        }

        .transaction-list { list-style: none; }
        
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            background: var(--bg-color);
            border: 1px solid var(--surface-border);
            transition: var(--transition);
        }

        .transaction-item:hover { border-color: var(--text-secondary); }

        .t-info { display: flex; align-items: center; gap: 12px; }
        .t-badge {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .t-details h4 { font-size: 0.92rem; font-weight: 600; margin-bottom: 2px; }
        .t-details p { font-size: 0.78rem; color: var(--text-secondary); }

        .t-right { display: flex; align-items: center; gap: 12px; }
        .t-amount { font-weight: 700; color: var(--danger); font-size: 0.95rem; }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .btn-delete:hover { color: var(--danger); background: var(--danger-glow); }

        .summary-total {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px dashed var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-total span { font-size: 0.88rem; color: var(--text-secondary); }
        .summary-total h3 { font-size: 1.25rem; color: var(--text-primary); font-weight: 700; }

        .export-btn {
            background: transparent;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            padding: 14px;
            border-radius: var(--radius-md);
            width: 100%;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .export-btn:hover {
            background: var(--accent-glow);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        .export-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--text-secondary); color: var(--text-secondary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <div class="brand-icon">🧾</div>
            <h1>Count</h1>
        </div>
        <audio id="bgMusic" loop preload="none">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3" type="audio/mpeg">
        </audio>
        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
            <span>🎵</span> <span id="musicText">Ambiente</span>
        </button>
    </header>

    <!-- Cards de Métricas Rápidas -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">Total Geral</div>
            <div class="value highlight" id="kpi-total">R$ 0,00</div>
        </div>
        <div class="stat-card">
            <div class="label">Média / Item</div>
            <div class="value" id="kpi-avg">R$ 0,00</div>
        </div>
        <div class="stat-card">
            <div class="label">Maior Gasto</div>
            <div class="value" id="kpi-top-cat">-</div>
        </div>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="card">
        <div class="input-group full">
            <label for="desc">Descrição do Gasto</label>
            <input type="text" id="desc" placeholder="Ex: Material de Obra, Fatura do Cartão...">
        </div>
        <div class="input-grid">
            <div class="input-group">
                <label for="val">Valor (R$)</label>
                <input type="number" id="val" placeholder="0,00" step="0.01" min="0.01">
            </div>
            <div class="input-group">
                <label for="date">Data</label>
                <input type="date" id="date">
            </div>
        </div>
        <div class="input-group full">
            <label for="cat">Categoria</label>
            <select id="cat">
                <option value="Contas Fixas">🏠 Contas Fixas / Mensais</option>
                <option value="Cartão de Crédito">💳 Cartão de Crédito</option>
                <option value="Obras e Reformas">🏗️ Obras e Reformas de Casa</option>
                <option value="Gastos Pessoais">👤 Gastos Pessoais</option>
                <option value="Gastos Emergenciais">🚨 Gastos Emergenciais</option>
            </select>
        </div>
        <button class="primary" onclick="addExpense()">+ Registrar Lançamento</button>
    </div>

    <!-- Lista e Gráfico -->
    <div class="card">
        <div class="filter-container">
            <h2 style="font-size: 1.1rem; font-weight: 600;">Histórico de Gastos</h2>
            <select id="monthFilter" onchange="updateUI()">
                <option value="ALL">Todos os Meses</option>
            </select>
        </div>

        <div class="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>
        
        <ul class="transaction-list" id="t-list">
            <!-- Injetado via JS -->
        </ul>

        <div class="summary-total">
            <span>Total no Período Selecionado:</span>
            <h3 id="total-view">R$ 0,00</h3>
        </div>
    </div>

    <button class="export-btn" id="exportBtn" onclick="generateReceiptImage()">
        <span>🧾</span> Baixar Comprovante (Imagem)
    </button>
</div>

<script>
    // Usa 'countExpenses' mas puxa do financeBotExpenses caso exista histórico antigo do usuário
    let expenses = JSON.parse(localStorage.getItem('countExpenses')) || JSON.parse(localStorage.getItem('financeBotExpenses')) || [];
    let myChart = null;

    const categoryMeta = {
        'Contas Fixas': { color: '#38bdf8', icon: '🏠', bg: 'rgba(56, 189, 248, 0.15)' },
        'Cartão de Crédito': { color: '#f43f5e', icon: '💳', bg: 'rgba(244, 63, 94, 0.15)' },
        'Obras e Reformas': { color: '#f59e0b', icon: '🏗️', bg: 'rgba(245, 158, 11, 0.15)' },
        'Gastos Pessoais': { color: '#10b981', icon: '👤', bg: 'rgba(16, 185, 129, 0.15)' },
        'Gastos Emergenciais': { color: '#a855f7', icon: '🚨', bg: 'rgba(168, 85, 247, 0.15)' }
    };

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    const music = document.getElementById('bgMusic');
    music.volume = 0.25;

    function toggleMusic() {
        const btn = document.getElementById('musicBtn');
        const txt = document.getElementById('musicText');
        if (music.paused) {
            music.play();
            btn.classList.add('playing');
            txt.innerText = 'Tocando';
        } else {
            music.pause();
            btn.classList.remove('playing');
            txt.innerText = 'Ambiente';
        }
    }

    function formatCurrency(val) {
        return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function initChart() {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: [], datasets: [{ data: [], backgroundColor: [], borderWidth: 0, hoverOffset: 6 }] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '72%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#94a3b8', font: { size: 11, family: 'system-ui' }, padding: 14 }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return ` ${context.label}: ${formatCurrency(context.raw)}`;
                            }
                        }
                    }
                }
            }
        });
    }

    function addExpense() {
        const descInput = document.getElementById('desc');
        const valInput = document.getElementById('val');
        const catInput = document.getElementById('cat');
        const dateInput = document.getElementById('date');

        const desc = descInput.value.trim();
        const val = parseFloat(valInput.value);
        const cat = catInput.value;
        const rawDate = dateInput.value;

        if (!desc || isNaN(val) || val <= 0 || !rawDate) {
            alert("Preencha todos os campos corretamente com valores válidos.");
            return;
        }

        const [year, month, day] = rawDate.split('-');
        const formattedDate = `${day}/${month}/${year}`;
        const periodKey = `${month}/${year}`;

        const item = {
            id: Date.now(),
            desc,
            val,
            cat,
            rawDate,
            date: formattedDate,
            period: periodKey
        };

        expenses.unshift(item);
        localStorage.setItem('countExpenses', JSON.stringify(expenses));
        
        descInput.value = '';
        valInput.value = '';

        updateFilterOptions();
        updateUI();
    }

    function deleteExpense(id) {
        expenses = expenses.filter(e => e.id !== id);
        localStorage.setItem('countExpenses', JSON.stringify(expenses));
        updateFilterOptions();
        updateUI();
    }

    function updateFilterOptions() {
        const select = document.getElementById('monthFilter');
        const currentSelection = select.value;
        
        const periods = [...new Set(expenses.map(e => e.period))].sort().reverse();

        select.innerHTML = '<option value="ALL">Todos os Meses</option>';
        periods.forEach(p => {
            select.innerHTML += `<option value="${p}">${p}</option>`;
        });

        if (periods.includes(currentSelection) || currentSelection === 'ALL') {
            select.value = currentSelection;
        }
    }

    function updateUI() {
        const list = document.getElementById('t-list');
        const selectedPeriod = document.getElementById('monthFilter').value;
        
        list.innerHTML = '';
        let total = 0;
        let catTotals = {};

        const filteredExpenses = selectedPeriod === 'ALL' 
            ? expenses 
            : expenses.filter(e => e.period === selectedPeriod);

        if (filteredExpenses.length === 0) {
            list.innerHTML = '<li style="color: var(--text-secondary); font-size: 0.85rem; text-align: center; padding: 24px 0;">Nenhum lançamento registrado neste período.</li>';
        } else {
            filteredExpenses.forEach(e => {
                total += e.val;
                catTotals[e.cat] = (catTotals[e.cat] || 0) + e.val;
                const meta = categoryMeta[e.cat] || { icon: '📌', color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.15)' };

                list.innerHTML += `
                    <li class="transaction-item">
                        <div class="t-info">
                            <div class="t-badge" style="background: ${meta.bg}; color: ${meta.color};">${meta.icon}</div>
                            <div class="t-details">
                                <h4>${e.desc}</h4>
                                <p>${e.cat} • ${e.date}</p>
                            </div>
                        </div>
                        <div class="t-right">
                            <div class="t-amount">${formatCurrency(e.val)}</div>
                            <button class="btn-delete" title="Excluir" onclick="deleteExpense(${e.id})">×</button>
                        </div>
                    </li>
                `;
            });
        }

        // Atualizar KPI Cards Globais
        const totalGeral = expenses.reduce((acc, curr) => acc + curr.val, 0);
        document.getElementById('kpi-total').innerText = formatCurrency(totalGeral);
        document.getElementById('kpi-avg').innerText = expenses.length > 0 ? formatCurrency(totalGeral / expenses.length) : 'R$ 0,00';
        
        let topCat = '-';
        let topVal = 0;
        let globalCatTotals = {};
        expenses.forEach(e => {
            globalCatTotals[e.cat] = (globalCatTotals[e.cat] || 0) + e.val;
            if (globalCatTotals[e.cat] > topVal) {
                topVal = globalCatTotals[e.cat];
                topCat = e.cat;
            }
        });
        document.getElementById('kpi-top-cat').innerText = topCat.split(' ')[0];

        // Atualizar Visão Total do Período
        document.getElementById('total-view').innerText = formatCurrency(total);

        // Atualizar Gráfico
        const categories = Object.keys(catTotals);
        const values = Object.values(catTotals);
        const chartColors = categories.map(cat => (categoryMeta[cat] ? categoryMeta[cat].color : '#38bdf8'));

        myChart.data.labels = categories;
        myChart.data.datasets[0].data = values;
        myChart.data.datasets[0].backgroundColor = chartColors;
        myChart.update();
    }

    // NOVA FUNÇÃO: Gera Imagem com estilo de Nota Fiscal
    function generateReceiptImage() {
        const btn = document.getElementById('exportBtn');
        btn.disabled = true;
        btn.innerHTML = '<span>⏳</span> Processando Imagem...';

        const selectedPeriod = document.getElementById('monthFilter').value;
        const periodText = selectedPeriod === 'ALL' ? 'Todos os Meses' : selectedPeriod;

        const filteredExpenses = selectedPeriod === 'ALL' 
            ? expenses 
            : expenses.filter(e => e.period === selectedPeriod);

        let total = 0;
        let catTotals = {};

        let rowsHtml = '';
        filteredExpenses.forEach(e => {
            total += e.val;
            catTotals[e.cat] = (catTotals[e.cat] || 0) + e.val;
            
            rowsHtml += `
                <tr>
                    <td style="padding: 4px 0; vertical-align: top;">${e.date.substring(0,5)}</td>
                    <td style="padding: 4px 5px; vertical-align: top; word-break: break-word;">${e.desc}</td>
                    <td style="padding: 4px 0; text-align: right; vertical-align: top;">${formatCurrency(e.val)}</td>
                </tr>
            `;
        });

        let catSummaryHtml = '';
        Object.keys(catTotals).forEach(cat => {
            catSummaryHtml += `
                <div style="display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0;">
                    <span>${cat}</span>
                    <span>${formatCurrency(catTotals[cat])}</span>
                </div>
            `;
        });

        // HTML do Cupom Fiscal (estilo térmico monoespaçado)
        const receiptHtml = `
            <div id="receipt-container" style="
                font-family: 'Courier New', Courier, monospace; 
                color: #000; 
                padding: 24px; 
                background-color: #fff; 
                width: 320px; 
                box-sizing: border-box; 
                border: 1px solid #eee;
            ">
                <div style="text-align: center; border-bottom: 1px dashed #000; padding-bottom: 12px; margin-bottom: 12px;">
                    <h2 style="margin: 0; font-size: 26px; font-weight: bold; letter-spacing: 2px;">COUNT</h2>
                    <p style="margin: 6px 0 0; font-size: 13px; font-weight: bold;">EXTRATO DE DESPESAS</p>
                    <p style="margin: 6px 0 0; font-size: 12px;">Emissão: ${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</p>
                    <p style="margin: 4px 0 0; font-size: 12px;">Período: ${periodText}</p>
                </div>

                <div style="margin-bottom: 16px;">
                    <h3 style="font-size: 13px; margin: 0 0 6px 0; border-bottom: 1px dashed #000; padding-bottom: 4px; text-align: center;">RESUMO POR CATEGORIA</h3>
                    ${catSummaryHtml || '<p style="font-size: 12px; text-align:center;">Nenhum registro.</p>'}
                </div>

                <div style="margin-bottom: 16px;">
                    <h3 style="font-size: 13px; margin: 0 0 6px 0; border-bottom: 1px dashed #000; padding-bottom: 4px; text-align: center;">DETALHES DOS GASTOS</h3>
                    <table style="width: 100%; font-size: 12px; text-align: left; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 1px dashed #000;">
                                <th style="padding: 4px 0; font-weight: normal;">Data</th>
                                <th style="padding: 4px 5px; font-weight: normal;">Desc</th>
                                <th style="padding: 4px 0; text-align: right; font-weight: normal;">Valor</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml || '<tr><td colspan="3" style="text-align: center; padding: 10px 0;">Vazio</td></tr>'}
                        </tbody>
                    </table>
                </div>

                <div style="text-align: right; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 10px 0; margin-bottom: 16px; font-size: 16px; font-weight: bold;">
                    TOTAL: ${formatCurrency(total)}
                </div>

                <div style="text-align: center; font-size: 11px;">
                    <p style="margin: 0;">*** OBRIGADO POR USAR O COUNT ***</p>
                    <p style="margin: 4px 0 0;">CONTROLE SEU DINHEIRO</p>
                </div>
            </div>
        `;

        // Criar um container temporário escondido na tela para o html2canvas renderizar
        const wrapper = document.createElement('div');
        wrapper.style.position = 'absolute';
        wrapper.style.left = '-9999px';
        wrapper.style.top = '0';
        wrapper.innerHTML = receiptHtml;
        document.body.appendChild(wrapper);

        const receiptElement = wrapper.querySelector('#receipt-container');

        // Renderizar a imagem
        html2canvas(receiptElement, { 
            scale: 2, 
            useCORS: true, 
            backgroundColor: "#ffffff" 
        }).then(canvas => {
            // Converter canvas em imagem PNG
            const imgData = canvas.toDataURL('image/png');
            
            // Criar link para download automático
            const link = document.createElement('a');
            link.href = imgData;
            link.download = `Comprovante_Count_${periodText.replace('/', '_')}.png`;
            link.click();
            
            // Limpeza
            document.body.removeChild(wrapper);
            btn.disabled = false;
            btn.innerHTML = '<span>🧾</span> Baixar Comprovante (Imagem)';
        }).catch(err => {
            console.error('Erro ao gerar imagem:', err);
            alert('Ocorreu um erro ao gerar a imagem. Tente novamente.');
            document.body.removeChild(wrapper);
            btn.disabled = false;
            btn.innerHTML = '<span>🧾</span> Baixar Comprovante (Imagem)';
        });
    }

    // Inicialização
    initChart();
    updateFilterOptions();
    updateUI();
</script>
</body>
</html>
